# get ip from  v4_cidr_blocks = ["10.0.10.0/24"] in vm subnet, from 10.0.10.3 to 10.0.10.254 ( 0 - network adress, 1 - gateway, 2 - mb use for cloud service, 255 - broadcast address)
cluster_vip: 10.0.10.200
cluster_vip_port: 7443

# immediately change kube manifest to vip
change_kube_manifests: false

kubeadm_config_path: "/etc/kubernetes/kubeadm-config-copy.yaml"