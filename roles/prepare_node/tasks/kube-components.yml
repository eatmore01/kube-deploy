- name: Remove current k8s packages
  ansible.builtin.apt:
    pkg:
    - kubectl
    - kubelet
    - kubeadm
    state: absent

- name: Find all apt repositories for k8s
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*kube*'
    file_type: file
  register: kube_repos

- name: Remove all k8s apt repos
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ kube_repos.files }}"

- name: Remove old k8s repo from main sources.list if present
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '.*kubernetes.*'
    state: absent

- name: Clean up old k8s keys from trusted.gpg.d (deprecated location)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
  - /etc/apt/trusted.gpg.d/k8s.gpg
  - /etc/apt/trusted.gpg.d/kubernetes-archive-keyring.gpg


- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kube_version | regex_search('[0-9]+\\.[0-9]+') }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: '0644'

- name: Convert GPG key to binary format and store in keyrings
  ansible.builtin.shell: |
    gpg --dearmor < /tmp/kubernetes-release.key > /usr/share/keyrings/kubernetes-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/kubernetes-archive-keyring.gpg

- name: Remove temporary key file
  ansible.builtin.file:
    path: /tmp/kubernetes-release.key
    state: absent

- name: Add Kubernetes repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kube_version | regex_search('[0-9]+\\.[0-9]+') }}/deb/ /"
    state: present
    filename: kubernetes
    update_cache: true

- name: Install Kubernetes packages
  ansible.builtin.apt:
    pkg:
    - kubelet
    - kubeadm
    - kubectl
    state: present
    allow_change_held_packages: true
