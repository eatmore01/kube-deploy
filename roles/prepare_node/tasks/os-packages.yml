- name: Ensure timesyncd absent when using ntp
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent
    purge: true

- name: Install packages apt
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    pkg:
    - ntp
    - net-tools
    - gpg
    - iproute2
    - iptables
    - vim
    - git
    - tar
    - jq
    - conntrack
    - socat
    - tree
    - ipvsadm
    - python3-yaml
    state: present
    update_cache: true
