
- name: Install packages apt
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    pkg:
    - chrony
    - net-tools
    - gpg
    - iproute2
    - iptables
    - vim
    - git
    - tar
    - jq
    - conntrack
    - socat
    - tree
    - ipvsadm
    - python3-yaml
    - curl
    - gnupg
    - apt-transport-https
    state: present
    update_cache: true
