- name: Disable and mask systemd-timesyncd to avoid conflict with Chrony
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
    masked: true # do not start timesyncd even if other service try to call it
  failed_when: false

- name: Enable and start Chrony service
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
