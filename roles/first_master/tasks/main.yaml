# 1-st control node
- name: Check if kubeadm has already run
  ansible.builtin.stat:
    path: "/etc/kubernetes/pki/ca.key"
  when: inventory_hostname == groups['kube_masters'][0]
  register: kubeadm_ca

- name: End play
  ansible.builtin.meta: end_play
  when: kubeadm_ca.stat.exists

- name: Create /etc/kubernetes directory
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: '0700'

- name: Copy kubeadm-config.yaml
  ansible.builtin.template:
    src: kubeadm-config.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: '0600'

- name: Load k8s containers
  when: inventory_hostname == groups['kube_masters'][0]
  ansible.builtin.command: kubeadm config images pull

# init master
- name: Resolve skip-phases flag
  ansible.builtin.set_fact:
    _skip_kube_proxy: >-
      {{ cni == 'cilium' or (cni == 'calico' and enable_ebpf | bool) }}
  when: inventory_hostname == groups['kube_masters'][0]

- name: Build kubeadm init argv
  ansible.builtin.set_fact:
    _kubeadm_init_argv: "{{ _base + ([_skip_flag] if _skip_kube_proxy else []) }}"
  vars:
    _base:
    - kubeadm
    - init
    - --config
    - /etc/kubernetes/kubeadm-config.yaml
    _skip_flag: "--skip-phases=addon/kube-proxy"
  when: inventory_hostname == groups['kube_masters'][0]

- name: Init master control node
  ansible.builtin.command:
    argv: "{{ _kubeadm_init_argv }}"
    creates: /etc/kubernetes/admin.conf # skip if exist again
  when: inventory_hostname == groups['kube_masters'][0]
  register: kubeadm_init

- name: Debug kubeadm init output
  ansible.builtin.debug:
    var: kubeadm_init.stdout_lines
  when:
  - debug_enable | bool
  - kubeadm_init is changed
  - inventory_hostname == groups['kube_masters'][0]

# after master init setup
- name: Install Utils
  when: inventory_hostname == groups['kube_masters'][0]
  include_tasks: utils.yaml

- name: CNI
  when: inventory_hostname == groups['kube_masters'][0]
  ansible.builtin.include_tasks: cni.yaml

- name: Setup DNS
  when: inventory_hostname == groups['kube_masters'][0]
  ansible.builtin.include_tasks: dns.yaml


- name: Enable and start kubelet
  ansible.builtin.service:
    name: kubelet
    state: started
    enabled: true
  when: inventory_hostname == groups['kube_masters'][0]

