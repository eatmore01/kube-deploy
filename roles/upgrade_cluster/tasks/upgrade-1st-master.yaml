- name: Get current version
  shell: "kubectl get nodes {{ ansible_fqdn }} -o=jsonpath='{.status.nodeInfo.kubeletVersion}'"
  register: version_current
  changed_when: false

- name: Check if upgrade is needed and skip if matches
  block:
  - name: Show message
    debug:
      msg: "Node {{ ansible_fqdn }} is already on version {{ kube_version }}"

  - name: Stop execution for this host
    meta: end_host
  when: kube_version | string in version_current.stdout

