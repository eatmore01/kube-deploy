- name: Run kubeadm upgrade plan
  command: kubeadm upgrade plan v{{ kube_version }}
  register: upgrade_plan

- name: Apply kubeadm upgrade
  command: "kubeadm upgrade apply v{{ full_kube_version_for_upgrade }} -y"
  register: upgrade_apply
  async: 600
  poll: 10

- name: Show upgrade result
  debug:
    var: upgrade_apply.stdout_lines

- name: Unhold packages
  dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
  - kubelet
  - kubectl

- name: Upgrade kubelet and kubectl
  apt:
    name:
    - "kubelet={{ full_kube_version_for_upgrade }}*"
    - "kubectl={{ full_kube_version_for_upgrade }}*"
    state: present
    allow_change_held_packages: yes

- name: Run kubeadm upgrade node
  command: kubeadm upgrade node

- name: Restart kubelet
  systemd:
    name: kubelet
    state: restarted
    daemon_reload: yes

- name: Hold packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
  - kubelet
  - kubectl
  - kubeadm
