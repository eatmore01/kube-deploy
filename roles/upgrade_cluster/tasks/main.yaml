- name: Upgrade kubeadm, on each node
  ansible.builtin.include_tasks: upgrade-kubeadm.yml

- name: Upgrade 1st master
  when: inventory_hostname == groups['kube_masters'][0]
  ansible.builtin.include_tasks: upgrade-1st-master.yaml

- name: Upgrade other master
  when:
  - inventory_hostname != groups['kube_masters'][0]
  - inventory_hostname in groups['kube_masters']
  ansible.builtin.include_tasks: upgrade-other-masters.yaml

- name: Upgrade worker nodes
  when: inventory_hostname in groups['kube_workers']
  ansible.builtin.include_tasks: upgrade-workers.yaml
